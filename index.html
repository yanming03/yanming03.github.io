<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Yanming 的研究、笔记与作品索引。" />
    <title>Yanming / Index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script defer src="content/index.js"></script>
    <script defer src="assets/js/site.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">跳到内容</a>

    <header class="identity" id="top">
      <h1>YANMING<span aria-hidden="true">_</span></h1>
    </header>

    <nav class="relations" aria-label="内容关系">
      <span>research</span>
      <span aria-hidden="true">-&gt;</span>
      <a href="#index" data-filter-link="paper">papers</a>
      <span aria-hidden="true">|</span>
      <a href="#index" data-filter-link="note">notes</a>
      <span aria-hidden="true">|</span>
      <a href="#index" data-filter-link="work">works</a>
    </nav>

    <main id="content">
      <section class="index" id="index" aria-labelledby="index-title">
        <header class="index-header">
          <h2 id="index-title">[index]</h2>
          <div class="filters" aria-label="筛选内容">
            <button class="active" type="button" data-filter="all">all</button>
            <button type="button" data-filter="paper">paper</button>
            <button type="button" data-filter="note">note</button>
            <button type="button" data-filter="work">work</button>
          </div>
        </header>

        <div class="column-labels" aria-hidden="true">
          <span>no.</span><span>type</span><span>title</span><span>year</span><span>link</span>
        </div>
        <ol class="entries" id="entries" aria-live="polite"></ol>
        <p class="empty" id="empty" hidden>no entries.</p>
      </section>
    </main>

    <footer class="contact" id="contact">
      <span>[contact]</span>
      <a href="mailto:hello@example.com">mail -&gt;</a>
      <a href="#">github -&gt;</a>
      <a href="#">scholar -&gt;</a>
      <a class="top" href="#top">top ↑</a>
    </footer>
  </body>
</html>
